<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IVR Generator</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png" />
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <input type="hidden" id="csrfToken" />

    <div class="container mt-3">

        <!-- Header -->
        <div class="row justify-content-center mb-3">
            <div class="col-auto">
                <h1 class="app-title">IVR <span class="app-subtitle">Generator</span></h1>
            </div>
        </div>

        <!-- Company name -->
        <div class="row mb-3">
            <div class="col">
                <label for="ragioneSociale_input" class="form-label fw-semibold">Ragione Sociale – Sede</label>
                <textarea
                    class="form-control"
                    id="ragioneSociale_input"
                    rows="1"
                    placeholder="Es: Acme SRL - Milano"
                    autocomplete="off"
                ></textarea>
            </div>
        </div>

        <!-- Music selector + upload -->
        <div class="row align-items-center mb-4" id="dropdownContainer">
            <div class="col-auto">
                <label for="music" class="form-label fw-semibold mb-1">Musica di sottofondo</label>
                <select id="music" class="form-select" aria-label="Selezione canzone">
                    <!-- populated by JS -->
                </select>
            </div>
            <div class="col-auto mt-4">
                <input type="file" id="audioUpload" class="d-none" accept="audio/*" />
                <button id="uploadButton" class="btn btn-outline-secondary btn-sm">
                    &#8679; Carica brano
                </button>
            </div>
        </div>

        <!-- Message rows -->
        <audio id="audioPlayer"></audio>
        <form id="main">
            <div class="row gx-2" id="formRow0">
                <!-- Left column: file type + shortcuts + toggle -->
                <div class="col-md-3">
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn-close custom-btn-close" id="deleteRow0" aria-label="Elimina riga"></button>
                    </div>
                    <div class="mb-2">
                        <textarea class="form-control" id="fileName0" rows="1" placeholder="Tipo (Benvenuto, Notte…)"></textarea>
                    </div>
                    <div class="name-shortcuts mb-2">
                        <button type="button" class="btn btn-sm btn-outline-primary" data-shortcut="Benvenuto" data-target="fileName0">Ben.</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" data-shortcut="Notte" data-target="fileName0">Not.</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" data-shortcut="Attesa" data-target="fileName0">Att.</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" data-shortcut="Occupato" data-target="fileName0">Occ.</button>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="translateCheck0" />
                        <label class="form-check-label" for="translateCheck0">Aggiungi traduzione EN</label>
                    </div>
                </div>

                <!-- Center column: message text -->
                <div class="col-md-8">
                    <textarea class="form-control" id="messageText0" rows="5" placeholder="Testo del messaggio IVR…"></textarea>
                </div>

                <!-- Right column: play button -->
                <div class="col-md-1 d-flex flex-column align-items-center justify-content-center">
                    <button class="btn btn-sm btn-danger play-btn" id="controller0" disabled aria-label="Play/Pausa">&#9654;</button>
                </div>

                <div class="col-12 mt-2"><hr /></div>
            </div>
        </form>

        <!-- Add row button -->
        <div class="text-center mb-4">
            <button type="button" class="btn btn-outline-primary btn-sm" id="addInput" title="Aggiungi messaggio">
                &#43; Aggiungi messaggio
            </button>
        </div>

        <!-- Action buttons -->
        <div class="row justify-content-center gap-2 mb-5">
            <div class="col-auto">
                <button id="sendQuery" type="button" class="btn btn-primary">
                    &#9889; Genera e ascolta
                </button>
            </div>
            <div class="col-auto">
                <button id="saveAll" type="button" class="btn btn-success" disabled>
                    &#8595; Salva come .zip
                </button>
            </div>
        </div>

    </div><!-- /container -->

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">&#9888; Attenzione</h5>
                </div>
                <div class="modal-body" id="errorMessage"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <button type="button" class="btn btn-info info-button" data-bs-toggle="modal" data-bs-target="#infoModal" title="Legenda comandi SSML">
        &#9432;
    </button>

    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalLabel">Legenda Comandi SSML</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Numero di telefono:</strong></p>
                    <code id="ssmlPhoneSnippet">&lt;say-as interpret-as="telephone"&gt;XX&lt;/say-as&gt;</code>
                    <button id="copyButton1" class="btn btn-success btn-sm ms-2">Copia</button>
                    <p class="mt-2 text-muted">Legge il numero come numero di telefono (cifra per cifra).</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload success toast -->
    <div class="toast align-items-center text-white bg-success border-0" id="successToast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">&#10003; File caricato con successo!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Chiudi"></button>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
</body>

</html>
